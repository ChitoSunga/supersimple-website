<!DOCTYPE html>

<html>
<head>
    
</head>

<body>
    <style>
        .subscribe-button {
            background-color: rgb(255, 0, 0);
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 8px;
            margin-left: 20px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 16px;
            padding-right: 16px;
            transition: opacity 0.1s;
            vertical-align: top;
        }
    
        .subscribe-button:hover{
              opacity: 0.8;
        }
        
        .subscribe-button:active{
              opacity: 0.5;
        }
        
        .join-button {
            color: rgb(41,118,211);
            border-style: solid;
            border-width: 1px;
            border-color: rgb(41,118,211);
            cursor: pointer;
            margin-right: 5px;
            transition: background-color .15s, color .15s;
            padding-top: 9px;
            padding-bottom: 9px;
            padding-left: 16px;
            padding-right: 16px;
            vertical-align: top;
            
        }
    
        .join-button:hover{
            color:white;
            background-color:rgb(41,118,211);
    
        }
    
        .join-button:active{
              opacity: 0.7;
        }
        
    
        .tweet-button {
            color: white;
            font-weight: bold;
            font-size: 15;
            background-color: rgb(29,161,242);
            border: none;
            border-radius: 18px;
            cursor: pointer;
            transition: box-shadow .15;
            padding-top: 9px;
            padding-bottom: 9px;
            padding-left: 16px;
            padding-right: 16px;
            vertical-align: top;
        }
    
        .tweet-button:hover{
            box-shadow: 5px 5px 10px rgba( 0,  0 , 0, .25);;
            }
        
        .tweet-button:active{
              opacity: 0.5;
        }
        
    
    </style>



<button class="subscribe-button">SUBSCRIBE1</button>
<button class="join-button">JOIN</button>
<button class="tweet-button">Tweet</button>

</body>
</html>
