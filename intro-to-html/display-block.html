<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .text-box1,textbox2 {
            display: block;
            margin-bottom: 5px;

        }

        .text-desc {
            width: 200px;
            display: inline-block;
            vertical-align: middle;
        }
        
        .image-img {
           width : 300px;     
           display: block;
           vertical-align: middle;
        }

        .search-bar {
            font-size: 16px;
  width: 500px;
  border: none;
  padding-top: 12px;
  padding-bottom: 12px;
  padding-left: 15px;
  padding-right: 15px;
  border-radius: 30px;
  box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);
  margin-top: 20px;
  margin-left: 20px;
        }
    </style>


</head>
<body>
    <input class="text-box1" type="text" placeholder="Name">
    <input class="text-box2" type="text" placeholder="Email">
    <br>
    <p class="text-desc" >Thanks for chatting with our customer support.
        Would you like to take our quick survey?
    </p>
    <button>Yes</button>
    <button>No</button>
    <br>
    <img class="image-img" src="Google-Logo.png">
    <input class="search-bar" type="text" placeholder="Search Google or type a URL">
</body>
</html>
