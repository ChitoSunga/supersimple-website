<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .pict-box {
            width: 200px;
        }

        .pict-profile {
            display: inline-block;
        }
        .profile-text {
            display: inline-block;
            margin-top: 0;
            vertical-align : middle;
        }

    </style>
</head>
<body>
    <div class="pict-box">
        <img src="cat1.png">
        <p><b>Oliver</b></p>
        <img class="pict-profile" src="cat1-1.png">
        <p class="profile-text">2 mutual friends</p>
        <button>Add Friend</button>
    </div>
</body>
</html>
